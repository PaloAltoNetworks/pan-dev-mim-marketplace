<svg width="176" height="108" viewBox="0 0 176 108" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark mode fallback icon -->
  <rect x="8" y="8" width="160" height="92" rx="8" fill="#2A2A2A"/>
  <rect x="8" y="8" width="160" height="92" rx="8" stroke="#404040" stroke-width="2"/>

  <!-- Puzzle piece icon in center -->
  <g transform="translate(88, 54)">
    <!-- Main puzzle piece shape -->
    <path d="M -20 -20 L 0 -20 C 0 -25 5 -30 10 -30 C 15 -30 20 -25 20 -20 L 20 0 C 25 0 30 5 30 10 C 30 15 25 20 20 20 L 0 20 C 0 25 -5 30 -10 30 C -15 30 -20 25 -20 20 L -20 0 C -25 0 -30 -5 -30 -10 C -30 -15 -25 -20 -20 -20 Z"
          fill="#FA582D"
          stroke="#FA582D"
          stroke-width="2"
          stroke-linejoin="round"/>
  </g>

  <!-- Grid pattern (subtle) -->
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#505050" opacity="0.3"/>
    </pattern>
  </defs>
  <rect x="8" y="8" width="160" height="92" rx="8" fill="url(#grid-dark)"/>
</svg>
