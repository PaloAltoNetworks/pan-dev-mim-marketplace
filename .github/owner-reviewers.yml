# .github/owner-reviewers.yml
#
# Integration directory -> required reviewer(s). Works identically for
# internal staff and external partners; none need repo access. Read at
# runtime by .github/scripts/check_owner_approval.py (the review gate) and
# request_owner_reviewers.py (auto-request). Full rationale and mechanics:
# .github/OWNER_APPROVAL_DESIGN.md.
#
# Two entry shapes are supported:
#
#   1. A bare list — applies to every product of that integration:
#        Integrations/MyTool: [some-github-user]
#
#   2. A map keyed by the exact product string from Config/approved_products.json
#      (also used verbatim by productVariants[].product) — scopes reviewers to
#      just that product, for a multi-product integration with different
#      owners per variant:
#        Integrations/MyMultiProductTool:
#          Certificate Manager Self-Hosted: [selfhosted-owner]
#          Certificate Manager SaaS: [saas-owner]
#      A product with no key here is treated as unmapped: any PR touching that
#      product's files (or a shared/root metadata field) fails the gate with
#      an actionable message, same as an entirely-unmapped directory.
#
# A directory missing from this file entirely fails the gate by design (a
# human must decide who reviews it) — UNLESS the directory is a brand-new
# integration that doesn't exist yet on the base branch, in which case the
# gate will trust an entry the PR itself adds here (self-service reviewer
# declaration for first-time contributors — see CONTRIBUTING.md). This never
# applies to a directory that already exists, even to add a new product
# variant to it; that always needs a maintainer-authored change here.
#
# A required reviewer who is also the PR's author is treated as self-attested
# (GitHub blocks literal self-approval) — this is what makes solo-maintained
# integrations work: `mim-final-approvers` still approves every PR regardless.
#
# STATUS: most existing integrations still have no entry here. That's fine for
# any integration whose next PR is authored by its own maintainer (self-attests
# via the mechanism above) or is brand-new (self-declares); an update PR from
# someone other than the integration's actual owner will fail the gate until a
# maintainer adds an entry.

Integrations/A10ThunderADC:     [paulternate]
Integrations/A10ThunderSSLi:    [paulternate]
Integrations/AkamaiAdaptableApplication: [gdbarron]
Integrations/FortinetFortiManager: [gdbarron]
Integrations/FortinetFortiGate:
  Certificate Manager Self-Hosted: [gdbarron]
  Certificate Manager SaaS: [paulternate]                     # temp — no product-team owner assigned yet
  Next-Gen Trust Security: [paulternate]                      # temp — no product-team owner assigned yet
Integrations/PaloAltoPanorama:
  Certificate Manager Self-Hosted: [gdbarron]
  Certificate Manager SaaS: [paulternate]                     # temp — no product-team owner assigned yet; variants not created yet
  Next-Gen Trust Security: [paulternate]                      # temp — no product-team owner assigned yet; variants not created yet
Integrations/FortinetFortiWeb:
  Certificate Manager Self-Hosted: [gdbarron]
  Certificate Manager SaaS: [paulternate]                     # self-declared for a root-level field touch; gdbarron still owns Self-Hosted
  Next-Gen Trust Security: [paulternate]

