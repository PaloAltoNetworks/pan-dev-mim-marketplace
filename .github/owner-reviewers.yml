# Not a real integration directory — a top-level redirect-alias data file. The
# gate's touched_integration_dirs() treats any Integrations/<name> path segment
# as a directory without checking it's actually one, so this needs an entry
# too. Consider fixing touched_integration_dirs() to skip non-directory paths
# instead, so files like this don't need a reviewer mapping at all.
Integrations/.route-aliases.json: [paulternate]

# Same gap as .route-aliases.json above — the gate doesn't exclude dot-prefixed paths
# even though the generator scripts do (Integrations/.template is scaffolding for new
# integrations, not a real listing).
Integrations/.template: [paulternate]

