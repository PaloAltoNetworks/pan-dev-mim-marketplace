<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="MIM Marketplace integration">
  <title>MIM Marketplace integration</title>
  <desc>Generic fallback logo used when an integration does not provide its own logo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3A55"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="72" fill="url(#bg)"/>
  <g fill="none" stroke="#8FB3FF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- three connected nodes: a neutral "integration" mark -->
    <line x1="140" y1="140" x2="260" y2="140"/>
    <line x1="140" y1="140" x2="150" y2="255"/>
    <line x1="260" y1="140" x2="250" y2="255"/>
    <line x1="150" y1="255" x2="250" y2="255"/>
  </g>
  <g fill="#E6EEFF" stroke="#8FB3FF" stroke-width="10">
    <circle cx="140" cy="140" r="30"/>
    <circle cx="260" cy="140" r="30"/>
    <circle cx="200" cy="255" r="34"/>
  </g>
</svg>
